<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- AUTH SECTION -->
  <div id="auth-section">
    <div class="auth-wrapper">
      <div class="auth-brand">
        <div class="brand-icon">✦</div>
        <h1>TaskFlow</h1>
        <p>Manage your work, clearly.</p>
      </div>

      <div class="auth-tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Login</button>
        <button class="tab-btn" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Login Form -->
      <div id="login-form" class="auth-form">
        <div class="field-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" />
        </div>
        <div class="field-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••" />
        </div>
        <button class="btn-primary" onclick="login()">
          <span>Login</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>

      <!-- Register Form -->
      <div id="register-form" class="auth-form" style="display:none;">
        <div class="field-group">
          <label>Username</label>
          <input type="text" id="reg-username" placeholder="johndoe" />
        </div>
        <div class="field-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="you@example.com" />
        </div>
        <div class="field-group">
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="Min 8 chars, 1 uppercase, 1 number, 1 special" />
          <div class="password-hints">
            <span id="hint-length" class="hint">8+ chars</span>
            <span id="hint-upper" class="hint">Uppercase</span>
            <span id="hint-number" class="hint">Number</span>
            <span id="hint-special" class="hint">Special (!@#$)</span>
          </div>
        </div>
        <button class="btn-primary" onclick="register()">
          <span>Create Account</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>

      <p id="auth-message" class="message"></p>
    </div>
  </div>

  <!-- TASKS SECTION -->
  <div id="tasks-section" style="display:none;">
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-icon-sm">✦</div>
        <span>TaskFlow</span>
      </div>
      <div class="header-right">
        <span id="welcome-msg" class="welcome-msg"></span>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>
    </header>

    <main class="app-main">
      <!-- Stats Bar -->
      <div class="stats-bar">
        <div class="stat-item">
          <span class="stat-number" id="stat-total">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="stat-pending">0</span>
          <span class="stat-label">Pending</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="stat-progress">0</span>
          <span class="stat-label">In Progress</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="stat-done">0</span>
          <span class="stat-label">Done</span>
        </div>
      </div>

      <!-- Add Task -->
      <div class="add-task-card">
        <h2>New Task</h2>
        <div class="add-task-row">
          <input type="text" id="task-title" placeholder="Task title..." />
          <input type="text" id="task-description" placeholder="Description (optional)" />
          <select id="task-status">
            <option value="pending">Pending</option>
            <option value="in_progress">In Progress</option>
            <option value="completed">Completed</option>
          </select>
          <button class="btn-add" onclick="createTask()">+ Add</button>
        </div>
        <p id="task-message" class="message"></p>
      </div>

      <!-- Filter Bar -->
      <div class="filter-bar">
        <button class="filter-btn active" onclick="filterTasks('all', this)">All</button>
        <button class="filter-btn" onclick="filterTasks('pending', this)">Pending</button>
        <button class="filter-btn" onclick="filterTasks('in_progress', this)">In Progress</button>
        <button class="filter-btn" onclick="filterTasks('completed', this)">Completed</button>
      </div>

      <!-- Task List -->
      <div id="task-list" class="task-list">
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">📋</div>
          <p>No tasks yet. Add your first task above!</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Edit Modal -->
  <div id="edit-modal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h3>Edit Task</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="field-group">
        <label>Title</label>
        <input type="text" id="edit-title" />
      </div>
      <div class="field-group">
        <label>Description</label>
        <input type="text" id="edit-description" />
      </div>
      <div class="field-group">
        <label>Status</label>
        <select id="edit-status">
          <option value="pending">Pending</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn-primary" onclick="saveEdit()">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
